<!--
  First focusable element on the page, hidden until focused. The sidebar carries
  up to a dozen role-specific links plus the header controls, and a keyboard or
  screen-reader user had to walk all of them again on every navigation before
  reaching the content. `inset-s-4` rather than `left-4`: Arabic is the default
  locale, so the link must appear on the reading-start side in both directions.
-->
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:inset-s-4 focus:z-[100] focus:inline-flex focus:min-h-11 focus:items-center focus:rounded-input focus:bg-brand-500 focus:px-4 focus:text-sm focus:font-semibold focus:text-white"
>
  {{ 'common.skipToContent' | translate }}
</a>

<div class="flex min-h-screen bg-canvas">
  <app-sidebar />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header />

    <!-- `tabindex="-1"` so the skip link can actually move focus here, not just
         scroll to it; a plain anchor target is not focusable. -->
    <main id="main-content" tabindex="-1" class="flex-1 px-4 py-6 sm:px-5 lg:px-6">
      <div class="mx-auto w-full max-w-[1200px]">
        <router-outlet />
      </div>
    </main>

    <footer class="border-t border-ink-300/60 px-4 py-4 text-center text-xs text-ink-500 sm:px-5 lg:px-6">
      {{ 'footer.copyright' | translate: { year: currentYear } }}
    </footer>
  </div>
</div>

<app-toasts />
