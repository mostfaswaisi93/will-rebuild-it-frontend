<div class="flex flex-col gap-2">
  @if (labelKey()) {
    <span [id]="uid + '-label'" class="text-sm font-medium text-ink-700">{{ labelKey()! | translate }}</span>
  }
  <div
    role="radiogroup"
    [attr.aria-labelledby]="labelKey() ? uid + '-label' : null"
    [attr.aria-label]="labelKey() ? null : ('shared.severitySelect.groupLabel' | translate)"
    class="grid grid-cols-1 gap-3 sm:grid-cols-3"
  >
    @for (option of options; track option; let i = $index) {
      <button
        #optionButton
        type="button"
        role="radio"
        [attr.aria-checked]="value() === option"
        [tabindex]="value() === option || (!value() && i === 0) ? 0 : -1"
        class="flex min-h-11 items-center justify-center gap-2 rounded-card border-2 px-3 py-3 text-center text-base transition-colors"
        [class]="
          value() === option
            ? 'border-brand-500 bg-brand-50 font-semibold text-brand-700'
            : 'border-ink-300 bg-surface-container-low text-ink-700 hover:border-outline'
        "
        [disabled]="disabled()"
        (click)="select(option)"
        (keydown)="onKeydown($event, i)"
      >
        <span class="h-2.5 w-2.5 shrink-0 rounded-full" [class]="dotClass(option)"></span>
        {{ 'master.severity.' + option | translate }}
      </button>
    }
  </div>
</div>
