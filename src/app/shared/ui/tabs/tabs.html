<div
  role="tablist"
  class="flex items-center gap-1 overflow-x-auto border-b border-ink-300 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
>
  @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      [id]="'tab-' + tab.id"
      [attr.aria-selected]="activeId() === tab.id"
      [attr.aria-controls]="'panel-' + tab.id"
      [attr.tabindex]="activeId() === tab.id ? 0 : -1"
      [class]="
        activeId() === tab.id
          ? 'min-h-11 shrink-0 whitespace-nowrap border-b-2 border-brand-500 px-3 py-2 text-sm font-medium text-brand-700'
          : 'min-h-11 shrink-0 whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm text-ink-500 hover:text-ink-900'
      "
      (click)="selectTab(tab.id)"
      (keydown)="onKeydown($event, i)"
    >
      {{ tab.labelKey | translate }}
    </button>
  }
</div>
