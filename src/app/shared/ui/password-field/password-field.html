<div class="flex flex-col gap-1">
  @if (labelKey()) {
    <label [for]="uid" class="text-sm font-medium text-ink-700">{{ labelKey()! | translate }}</label>
  }
  <div
    class="flex min-h-11 items-stretch overflow-hidden rounded-card border border-ink-300 bg-surface-container-low focus-within:border-brand-500 focus-within:outline focus-within:outline-2 focus-within:outline-brand-500/30"
  >
    <input
      [id]="uid"
      [type]="revealed() ? 'text' : 'password'"
      class="min-w-0 flex-1 bg-transparent px-3 text-base text-ink-900 outline-none disabled:opacity-60"
      [disabled]="disabled()"
      [value]="value()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-describedby]="errorId() ?? null"
      autocomplete="current-password"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
    <button
      type="button"
      class="flex w-11 shrink-0 items-center justify-center text-ink-500 hover:text-ink-700"
      [attr.aria-label]="(revealed() ? 'shared.passwordField.hide' : 'shared.passwordField.show') | translate"
      (click)="toggleReveal()"
    >
      @if (revealed()) {
        <svg lucideEyeOff [size]="18"></svg>
      } @else {
        <svg lucideEye [size]="18"></svg>
      }
    </button>
  </div>

  @if (showChecklist()) {
    <ul class="mt-1 flex flex-col gap-1 rounded-card bg-surface-container-low p-3 text-sm">
      @for (rule of rules(); track rule.key) {
        <li class="flex items-center gap-2" [class]="rule.satisfied ? 'text-brand-600' : 'text-ink-500'">
          @if (rule.satisfied) {
            <svg lucideCheck [size]="14"></svg>
          } @else {
            <svg lucideCircle [size]="14"></svg>
          }
          {{ 'shared.passwordField.rule.' + rule.key | translate }}
        </li>
      }
    </ul>
  }
</div>
