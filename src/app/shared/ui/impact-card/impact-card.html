<div class="rounded-card bg-surface p-4 shadow-card sm:p-5">
  <p class="text-sm text-ink-500">{{ labelKey() | translate }}</p>
  <p class="mt-1 text-2xl font-semibold text-ink-900">{{ valueLabel() }}</p>

  @if (percent() !== undefined) {
    <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-ink-300/30">
      <div
        class="h-full rounded-full bg-brand-500 transition-[width]"
        role="progressbar"
        [style.width.%]="clampedPercent()"
        [attr.aria-valuenow]="clampedPercent()"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>
    </div>
  }
</div>
