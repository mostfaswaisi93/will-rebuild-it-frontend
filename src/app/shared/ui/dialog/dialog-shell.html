<div
  class="fixed inset-x-0 bottom-0 flex max-h-[85vh] w-full flex-col overflow-y-auto rounded-t-card bg-surface shadow-card sm:relative sm:inset-auto sm:mx-auto sm:w-full sm:max-w-md sm:rounded-card"
>
  <header class="flex items-center justify-between gap-4 border-b border-outline-variant px-5 py-4">
    @if (titleKey(); as title) {
      <h2 class="text-lg font-semibold text-ink-900">{{ title | translate }}</h2>
    } @else {
      <span></span>
    }
    <button
      type="button"
      class="-me-2 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-ink-500 hover:bg-surface-container-low hover:text-ink-900"
      [attr.aria-label]="'common.close' | translate"
      (click)="close()"
    >
      <svg lucideX [size]="20"></svg>
    </button>
  </header>

  <div class="px-5 py-4">
    <ng-content />
  </div>

  <footer
    class="flex flex-col-reverse gap-2 border-t border-outline-variant px-5 py-4 sm:flex-row sm:justify-end"
  >
    <ng-content select="[dialogShellFooter]" />
  </footer>
</div>
