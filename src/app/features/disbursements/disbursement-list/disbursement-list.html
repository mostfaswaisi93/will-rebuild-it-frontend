<app-page-header
  [title]="'disbursements.title' | translate"
  [subtitle]="'disbursements.subtitle' | translate"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card labelKey="disbursements.summary.inFlight" [value]="count(summary()?.inFlightCount ?? 0)" tone="sand" [loading]="loading()" />
    <app-stat-card labelKey="disbursements.summary.inFlightAmount" [value]="money(summary()?.inFlightAmount ?? 0)" tone="sand" [loading]="loading()" />
    <app-stat-card labelKey="disbursements.summary.settled" [value]="money(summary()?.settledAmount ?? 0)" tone="brand" [loading]="loading()" />
    <app-stat-card labelKey="disbursements.summary.failed" [value]="count(summary()?.failedCount ?? 0)" tone="danger" [loading]="loading()" />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="disbursements.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'disbursements.columns.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'disbursements.filters.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.disbursement.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="method()"
        (change)="method.set($any($event.target).value)"
        [attr.aria-label]="'disbursements.columns.method' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'disbursements.filters.allMethods' | translate }}</option>
        @for (option of methods; track option) {
          <option [value]="option">{{ 'disbursements.method.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="10"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="disbursement" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'disbursements.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
