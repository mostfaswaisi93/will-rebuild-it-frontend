<nav class="mb-6" [attr.aria-label]="'auth.reset.stepsLabel' | translate">
  <ol class="flex items-center gap-2">
    @for (step of steps; track step) {
      <li class="flex flex-1 items-center gap-2">
        <span
          class="flex size-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold transition-colors"
          [class]="
            step < currentStep()
              ? 'bg-brand-500 text-white'
              : step === currentStep()
                ? 'bg-brand-500 text-white ring-4 ring-brand-500/20'
                : 'bg-surface-container text-ink-500'
          "
          [attr.aria-current]="step === currentStep() ? 'step' : null"
        >
          {{ step }}
        </span>
        @if (step < steps.length) {
          <span
            class="h-px flex-1 transition-colors"
            [class]="step < currentStep() ? 'bg-brand-500' : 'bg-ink-300'"
          ></span>
        }
      </li>
    }
  </ol>
</nav>

<router-outlet />
