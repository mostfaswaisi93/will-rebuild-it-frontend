<h1 class="text-2xl font-bold text-ink-900">{{ 'auth.reset.verify.title' | translate }}</h1>
<p class="mt-1 text-sm text-ink-500">
  {{ 'auth.reset.verify.subtitle' | translate }}
  <span class="font-medium text-ink-700" dir="ltr">{{ destination() }}</span>
</p>

<div class="mt-6">
  <app-otp-verification-step
    [code]="code()"
    (codeChange)="onCodeChange($event)"
    [length]="codeLength"
    (resend)="resend()"
  />

  @if (wrongCode()) {
    <p class="mt-3 text-center text-sm text-danger" role="alert">
      {{ 'auth.reset.verify.wrongCode' | translate }}
    </p>
  }
</div>

<div class="mt-6 flex items-center gap-3">
  <button
    type="button"
    (click)="back()"
    class="inline-flex min-h-11 items-center justify-center rounded-input border border-ink-300 px-5 py-2.5 text-sm font-medium text-ink-700 hover:bg-surface-container-low"
  >
    {{ 'common.previous' | translate }}
  </button>
  <button
    type="button"
    (click)="submit()"
    [disabled]="!canSubmit()"
    class="inline-flex min-h-11 flex-1 items-center justify-center rounded-input bg-brand-500 px-5 py-2.5 font-semibold text-white transition-colors hover:bg-brand-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40 disabled:cursor-not-allowed disabled:opacity-50"
  >
    {{ (verifying() ? 'common.loading' : 'common.next') | translate }}
  </button>
</div>
