<app-page-header
  [title]="'pricebook.title' | translate"
  [subtitle]="'pricebook.subtitle' | translate"
>
  <button
    pageHeaderActions
    type="button"
    (click)="add()"
    class="inline-flex min-h-11 items-center gap-1.5 rounded-input bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40"
  >
    <svg lucidePlus [size]="16" aria-hidden="true"></svg>
    {{ 'pricebook.addItem' | translate }}
  </button>
</app-page-header>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <app-filter-bar
    [(search)]="search"
    searchPlaceholderKey="pricebook.searchPlaceholder"
    (clear)="clearFilters()"
  >
    <select
      [value]="category()"
      (change)="category.set($any($event.target).value)"
      [attr.aria-label]="'pricebook.columns.category' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'pricebook.filters.allCategories' | translate }}</option>
      @for (option of categories; track option) {
        <option [value]="option">{{ 'estimates.category.' + option | translate }}</option>
      }
    </select>

    <select
      [value]="active()"
      (change)="active.set($any($event.target).value)"
      [attr.aria-label]="'pricebook.columns.status' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'pricebook.filters.allStatuses' | translate }}</option>
      <option value="active">{{ 'pricebook.active' | translate }}</option>
      <option value="inactive">{{ 'pricebook.inactive' | translate }}</option>
    </select>
  </app-filter-bar>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="12"
      [totalCount]="totalCount()"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="active" let-row>
        <span
          class="inline-block rounded-full px-2 py-0.5 text-xs font-medium"
          [class]="row.active ? 'bg-brand-50 text-brand-700' : 'bg-ink-300/40 text-ink-700'"
        >
          {{ (row.active ? 'pricebook.active' : 'pricebook.inactive') | translate }}
        </span>
      </ng-template>

      <ng-template #rowActions let-row>
        <div class="flex items-center justify-end gap-1">
          <button
            type="button"
            (click)="edit(row)"
            [attr.aria-label]="'common.edit' | translate"
            class="inline-flex size-9 items-center justify-center rounded-input text-ink-500 hover:bg-surface-container-low hover:text-ink-900"
          >
            <svg lucidePencil [size]="16" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            (click)="toggleActive(row)"
            [attr.aria-label]="(row.active ? 'pricebook.deactivate' : 'pricebook.activate') | translate"
            [class]="row.active ? 'text-danger hover:bg-danger/5' : 'text-brand-600 hover:bg-brand-50'"
            class="inline-flex size-9 items-center justify-center rounded-input"
          >
            <svg lucidePower [size]="16" aria-hidden="true"></svg>
          </button>
        </div>
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'pricebook.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
