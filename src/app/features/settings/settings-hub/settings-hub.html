<app-page-header
  [title]="'settings.hub.title' | translate"
  [subtitle]="'settings.hub.subtitle' | translate"
/>

<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
  @for (card of cards; track card.path) {
    <a
      [routerLink]="card.path"
      class="flex items-start gap-3 rounded-card border border-ink-300 bg-surface p-4 transition-colors hover:border-brand-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/30"
    >
      <span class="flex size-10 shrink-0 items-center justify-center rounded-card bg-brand-50 text-brand-600">
        <svg [lucideIcon]="card.icon" [size]="20" aria-hidden="true"></svg>
      </span>
      <span class="min-w-0">
        <span class="block font-semibold text-ink-900">{{ card.titleKey | translate }}</span>
        <span class="mt-0.5 block text-sm text-ink-500">{{ card.descriptionKey | translate }}</span>
      </span>
    </a>
  }
</div>
