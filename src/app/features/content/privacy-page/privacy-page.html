<app-page-header [title]="'content.privacy.title' | translate" [showBack]="true" />

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else if (loading()) {
  <div class="space-y-2">
    <div class="h-4 w-full animate-pulse rounded bg-ink-300/30"></div>
    <div class="h-4 w-11/12 animate-pulse rounded bg-ink-300/30"></div>
    <div class="h-4 w-10/12 animate-pulse rounded bg-ink-300/30"></div>
  </div>
} @else {
  <article class="rounded-card border border-ink-300 bg-surface p-5">
    <p class="whitespace-pre-line text-sm leading-relaxed text-ink-700">{{ body() }}</p>
  </article>
}
