<app-page-header
  [title]="'supplierDashboard.title' | translate"
  [subtitle]="'supplierDashboard.subtitle' | translate"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card
      labelKey="supplierDashboard.stats.total"
      [value]="count(totalCount())"
      [icon]="icons.orders"
      tone="brand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="supplierDashboard.stats.awaiting"
      [value]="count(awaitingCount())"
      [icon]="icons.orders"
      tone="sand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="supplierDashboard.stats.ordered"
      [value]="count(orderedCount())"
      [icon]="icons.inTransit"
      tone="neutral"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="supplierDashboard.stats.received"
      [value]="count(receivedCount())"
      [icon]="icons.received"
      tone="brand"
      [loading]="loading()"
    />
  </section>

  <section class="mt-6">
    <h2 class="text-sm font-semibold text-ink-900">{{ 'supplierDashboard.recentOrders' | translate }}</h2>
    <div class="mt-2">
      <app-data-table
        [columns]="columns"
        [rows]="recentOrders()"
        [loading]="loading()"
        [rowId]="trackOrder"
        [rowLink]="orderLink"
      >
        <ng-template appDataTableCell="status" let-row>
          <app-status-pill context="purchaseOrder" [status]="row.status" />
        </ng-template>

        <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
          {{ 'supplierDashboard.empty' | translate }}
        </div>
      </app-data-table>
    </div>
  </section>
}
