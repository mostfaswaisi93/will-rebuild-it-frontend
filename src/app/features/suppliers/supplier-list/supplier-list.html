<app-page-header
  [title]="'suppliers.title' | translate"
  [subtitle]="'suppliers.subtitle' | translate"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <app-filter-bar
    [(search)]="search"
    searchPlaceholderKey="suppliers.searchPlaceholder"
    (clear)="clearFilters()"
  >
    <select
      [value]="status()"
      (change)="status.set($any($event.target).value)"
      [attr.aria-label]="'suppliers.columns.status' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'suppliers.filters.allStatuses' | translate }}</option>
      @for (option of statuses; track option) {
        <option [value]="option">{{ 'shared.statusPill.supplier.' + option | translate }}</option>
      }
    </select>

    <select
      [value]="category()"
      (change)="category.set($any($event.target).value)"
      [attr.aria-label]="'suppliers.columns.categories' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'suppliers.filters.allCategories' | translate }}</option>
      @for (option of categoriesList; track option) {
        <option [value]="option">{{ 'materials.' + option | translate }}</option>
      }
    </select>

    <select
      [value]="governorate()"
      (change)="governorate.set($any($event.target).value)"
      [attr.aria-label]="'workRequests.filters.governorate' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'workRequests.filters.allGovernorates' | translate }}</option>
      @for (option of governorates; track option) {
        <option [value]="option">{{ 'governorates.' + option | translate }}</option>
      }
    </select>
  </app-filter-bar>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="10"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="supplier" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'suppliers.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
