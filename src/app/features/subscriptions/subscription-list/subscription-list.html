<app-page-header [title]="'subscriptions.title' | translate" [subtitle]="'subscriptions.subtitle' | translate" />

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-3">
    <app-stat-card
      labelKey="subscriptions.summary.active"
      [value]="(summary()?.activeCount ?? 0).toString()"
      tone="brand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="subscriptions.summary.pastDue"
      [value]="(summary()?.pastDueCount ?? 0).toString()"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="subscriptions.summary.revenue"
      [value]="money(summary()?.annualRevenue ?? 0, 'USD')"
      [loading]="loading()"
    />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="subscriptions.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'subscriptions.columns.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'subscriptions.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.subscription.' + option | translate }}</option>
        }
      </select>
      <select
        [value]="plan()"
        (change)="plan.set($any($event.target).value)"
        [attr.aria-label]="'subscriptions.columns.plan' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'subscriptions.allPlans' | translate }}</option>
        @for (option of plans; track option) {
          <option [value]="option">{{ 'subscriptions.plan.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="pageSize"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="subscription" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'subscriptions.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
