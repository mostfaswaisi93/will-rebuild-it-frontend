<app-page-header
  [title]="'dashboard.beneficiary.title' | translate"
  [subtitle]="'dashboard.greeting' | translate: { name: greeting() }"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-3">
    <app-stat-card
      labelKey="dashboard.beneficiary.projects"
      [value]="count(projectCount())"
      [icon]="icons.projects"
      tone="brand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="dashboard.beneficiary.requests"
      [value]="count(requestCount())"
      [icon]="icons.requests"
      tone="sand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="dashboard.beneficiary.funding"
      [value]="count(fundingCount())"
      [icon]="icons.funding"
      tone="neutral"
      [loading]="loading()"
    />
  </section>

  <section class="mt-6">
    <h2 class="text-sm font-semibold text-ink-900">{{ 'dashboard.beneficiary.recentProjects' | translate }}</h2>
    <div class="mt-2">
      <app-data-table
        [columns]="projectColumns"
        [rows]="recentProjects()"
        [loading]="loading()"
        [rowId]="trackProject"
        [rowLink]="projectLink"
      >
        <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
          {{ 'projects.empty' | translate }}
        </div>
      </app-data-table>
    </div>
  </section>
}
