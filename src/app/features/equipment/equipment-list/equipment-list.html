<app-page-header
  [title]="'equipment.title' | translate"
  [subtitle]="'equipment.subtitle' | translate"
>
  <a
    pageHeaderActions
    routerLink="/app/equipment/schedule"
    class="inline-flex min-h-11 items-center gap-1.5 rounded-input border border-ink-300 px-4 py-2 text-sm font-medium text-ink-700 hover:bg-surface-container-low"
  >
    <svg lucideCalendarRange [size]="16" aria-hidden="true"></svg>
    {{ 'equipment.viewSchedule' | translate }}
  </a>
  <a
    pageHeaderActions
    routerLink="/app/equipment/reports"
    class="inline-flex min-h-11 items-center rounded-input border border-ink-300 px-4 py-2 text-sm font-medium text-ink-700 hover:bg-surface-container-low"
  >
    {{ 'equipment.reports.title' | translate }}
  </a>
  @if (canManage()) {
    <a
      pageHeaderActions
      routerLink="/app/equipment/new"
      class="inline-flex min-h-11 items-center rounded-input bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
    >
      {{ 'equipment.form.newTitle' | translate }}
    </a>
  }
</app-page-header>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card labelKey="equipment.summary.total" [value]="count(summary()?.total ?? 0)" [loading]="loading()" />
    <app-stat-card labelKey="equipment.summary.available" [value]="count(summary()?.available ?? 0)" tone="brand" [loading]="loading()" />
    <app-stat-card labelKey="equipment.summary.inUse" [value]="count(summary()?.inUse ?? 0)" tone="sand" [loading]="loading()" />
    <app-stat-card labelKey="equipment.summary.unavailable" [value]="count(summary()?.unavailable ?? 0)" tone="danger" [loading]="loading()" />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="equipment.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="category()"
        (change)="category.set($any($event.target).value)"
        [attr.aria-label]="'equipment.columns.category' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'equipment.filters.allCategories' | translate }}</option>
        @for (option of categoriesList; track option) {
          <option [value]="option">{{ 'equipment.category.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'equipment.columns.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'equipment.filters.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.equipment.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="12"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="equipment" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'equipment.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
