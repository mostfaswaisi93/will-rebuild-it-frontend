<app-page-header
  [title]="'workRequests.title' | translate"
  [subtitle]="'workRequests.subtitle' | translate"
>
  @if (canCreate()) {
    <a
      pageHeaderActions
      routerLink="/app/work-requests/new"
      class="inline-flex min-h-11 items-center gap-1.5 rounded-input bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40"
    >
      <svg lucidePlus [size]="16" aria-hidden="true"></svg>
      {{ 'workRequests.new.action' | translate }}
    </a>
  }
</app-page-header>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card
      labelKey="workRequests.summary.total"
      [value]="count(summary()?.total ?? 0)"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="workRequests.summary.unassigned"
      [value]="count(summary()?.unassigned ?? 0)"
      tone="sand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="workRequests.summary.matched"
      [value]="count(summary()?.matched ?? 0)"
      tone="brand"
      [loading]="loading()"
    />
    <app-stat-card
      labelKey="workRequests.summary.accepted"
      [value]="count(summary()?.accepted ?? 0)"
      tone="brand"
      [loading]="loading()"
    />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="workRequests.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.request.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="severity()"
        (change)="severity.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.severity' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allSeverities' | translate }}</option>
        @for (option of severities; track option) {
          <option [value]="option">{{ 'master.severity.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="governorate()"
        (change)="governorate.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.governorate' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allGovernorates' | translate }}</option>
        @for (option of governorates; track option) {
          <option [value]="option">{{ 'governorates.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="type()"
        (change)="type.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.type' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allTypes' | translate }}</option>
        @for (option of types; track option) {
          <option [value]="option">{{ 'workRequests.type.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="origin()"
        (change)="origin.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.origin' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allOrigins' | translate }}</option>
        @for (option of origins; track option) {
          <option [value]="option">{{ 'workRequests.origin.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="10"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="request" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'workRequests.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
