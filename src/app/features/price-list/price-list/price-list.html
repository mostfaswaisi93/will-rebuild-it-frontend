<app-page-header [title]="'priceList.title' | translate" [subtitle]="'priceList.subtitle' | translate" />

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <app-filter-bar
    [(search)]="search"
    searchPlaceholderKey="priceList.searchPlaceholder"
    (clear)="clearFilters()"
  >
    <select
      [value]="trade()"
      (change)="trade.set($any($event.target).value)"
      [attr.aria-label]="'priceList.columns.trade' | translate"
      class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    >
      <option value="">{{ 'priceList.allTrades' | translate }}</option>
      @for (option of trades; track option) {
        <option [value]="option">{{ 'trades.' + option | translate }}</option>
      }
    </select>
  </app-filter-bar>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="10"
      [totalCount]="totalCount()"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'priceList.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
