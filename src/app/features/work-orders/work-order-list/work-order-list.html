<app-page-header
  [title]="'workOrders.title' | translate"
  [subtitle]="'workOrders.subtitle' | translate"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card labelKey="workOrders.summary.total" [value]="count(summary()?.total ?? 0)" [loading]="loading()" />
    <app-stat-card labelKey="workOrders.summary.scheduled" [value]="count(summary()?.scheduled ?? 0)" tone="sand" [loading]="loading()" />
    <app-stat-card labelKey="workOrders.summary.inProgress" [value]="count(summary()?.inProgress ?? 0)" tone="brand" [loading]="loading()" />
    <app-stat-card labelKey="workOrders.summary.completed" [value]="count(summary()?.completed ?? 0)" tone="brand" [loading]="loading()" />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="workOrders.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'workOrders.filters.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workOrders.filters.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.workOrder.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="priority()"
        (change)="priority.set($any($event.target).value)"
        [attr.aria-label]="'workOrders.filters.priority' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workOrders.filters.allPriorities' | translate }}</option>
        @for (option of priorities; track option) {
          <option [value]="option">{{ 'workOrders.priority.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="governorate()"
        (change)="governorate.set($any($event.target).value)"
        [attr.aria-label]="'workRequests.filters.governorate' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'workRequests.filters.allGovernorates' | translate }}</option>
        @for (option of governorates; track option) {
          <option [value]="option">{{ 'governorates.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="10"
      [totalCount]="totalCount()"
      [rowLink]="rowLink"
      [rowId]="rowId"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="priority" let-row>
        <app-status-pill context="workOrderPriority" [status]="row.priority" />
      </ng-template>
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="workOrder" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'workOrders.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
