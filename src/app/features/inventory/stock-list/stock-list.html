<app-page-header
  [title]="'inventory.title' | translate"
  [subtitle]="'inventory.subtitle' | translate"
/>

@if (failed()) {
  <p class="rounded-card border border-danger/30 bg-danger/5 px-4 py-3 text-sm text-danger">
    {{ 'common.errorGeneric' | translate }}
  </p>
} @else {
  <section class="grid gap-3 sm:grid-cols-3">
    <app-stat-card labelKey="inventory.summary.items" [value]="count(summary()?.total ?? 0)" [loading]="loading()" />
    <app-stat-card labelKey="inventory.summary.low" [value]="count(summary()?.low ?? 0)" tone="sand" [loading]="loading()" />
    <app-stat-card labelKey="inventory.summary.outOfStock" [value]="count(summary()?.outOfStock ?? 0)" tone="danger" [loading]="loading()" />
  </section>

  <div class="mt-6">
    <app-filter-bar
      [(search)]="search"
      searchPlaceholderKey="inventory.searchPlaceholder"
      (clear)="clearFilters()"
    >
      <select
        [value]="warehouseId()"
        (change)="warehouseId.set($any($event.target).value)"
        [attr.aria-label]="'inventory.columns.warehouse' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'inventory.filters.allWarehouses' | translate }}</option>
        @for (wh of warehouseList(); track wh.id) {
          <option [value]="wh.id">{{ wh.name }}</option>
        }
      </select>

      <select
        [value]="category()"
        (change)="category.set($any($event.target).value)"
        [attr.aria-label]="'suppliers.columns.categories' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'suppliers.filters.allCategories' | translate }}</option>
        @for (option of categoriesList; track option) {
          <option [value]="option">{{ 'materials.' + option | translate }}</option>
        }
      </select>

      <select
        [value]="status()"
        (change)="status.set($any($event.target).value)"
        [attr.aria-label]="'inventory.columns.status' | translate"
        class="min-h-11 rounded-input border border-ink-300 bg-surface px-3 text-sm text-ink-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
      >
        <option value="">{{ 'inventory.filters.allStatuses' | translate }}</option>
        @for (option of statuses; track option) {
          <option [value]="option">{{ 'shared.statusPill.stock.' + option | translate }}</option>
        }
      </select>
    </app-filter-bar>
  </div>

  <div class="mt-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [serverSide]="true"
      [pageSize]="12"
      [totalCount]="totalCount()"
      [rowId]="rowId"
      [rowLink]="rowLink"
      (pageChange)="onPageChange($event)"
    >
      <ng-template appDataTableCell="status" let-row>
        <app-status-pill context="stock" [status]="row.status" />
      </ng-template>

      <div dataTableEmpty class="rounded-card border border-dashed border-ink-300 bg-surface p-8 text-center text-ink-500">
        {{ 'inventory.empty' | translate }}
      </div>
    </app-data-table>
  </div>
}
